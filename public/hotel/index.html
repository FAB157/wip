<!--
  Pagina per le strutture ricettive (11/10/2026, committente: «un periodo di prova per hotel, con coupon da 500
  crediti che possono regalare ai clienti» + «anche pagina richiesta coupon per hotel»).
  Il modulo va alla STESSA rotta della pagina /comuni (POST /api/enti/richiesta) con tipo 'hotel' e servizio
  'coupon_prova'. Il coupon NON si crea da solo: la richiesta si legge, si approva nel pannello admin (Coupon,
  structure_name = nome dell'hotel) e il codice si manda per email. Qui si promette solo: un codice di prova,
  un numero di utilizzi legato alle camere, una scadenza, nessun costo. Non si dice «500 crediti» come cifra
  fissa: la decide il committente coupon per coupon (regola del 05/09/2026).
  Le 7 lingue stanno nel dizionario T: una voce nuova va in tutte e sette.
-->

var LINGUE = ["IT","EN","FR","ES","DE","RU","ZH"];
function linguaIniziale() {
  var q = (new URLSearchParams(location.search).get("lang") || "").toUpperCase();
  if (LINGUE.indexOf(q) >= 0) return q;
  try { var s = localStorage.getItem("wip_comuni_lang"); if (s && LINGUE.indexOf(s) >= 0) return s; } catch (e) {}
  var n = (navigator.language || "en").slice(0, 2).toUpperCase();
  return LINGUE.indexOf(n) >= 0 ? n : "EN";
}
var lingua = linguaIniziale();
// Da quale campagna arriva chi apre la pagina (?c=hotel-it nel link dell'email): si conta la visita, senza cookie.
var CAMPAGNA = (new URLSearchParams(location.search).get("c") || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 40);
(function () { try {
  var s = sessionStorage.getItem("wip_sessione"); var nuova = !sessionStorage.getItem("wip_vista_hotel");
  if (!s) { s = Math.random().toString(36).slice(2, 14); sessionStorage.setItem("wip_sessione", s); }
  if (nuova) { sessionStorage.setItem("wip_vista_hotel", "1"); fetch("/api/enti/visita", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pagina: "hotel", c: CAMPAGNA, lingua: lingua, sessione: s }), keepalive: true }); }
} catch (e) {} })();
function applica(l) {
  lingua = l; var d = T[l];
  document.documentElement.lang = l.toLowerCase();
  document.querySelectorAll("[data-t]").forEach(function (el) { var k = el.getAttribute("data-t"); if (d[k] != null) el.textContent = d[k]; });
  document.title = "WIP — " + d.titolo;
  document.getElementById("lingua").value = l;
  try { localStorage.setItem("wip_comuni_lang", l); } catch (e) {}
}
applica(lingua);
document.getElementById("lingua").addEventListener("change", function (e) { applica(e.target.value); });

var modulo = document.getElementById("modulo"), esito = document.getElementById("esito"), tasto = document.getElementById("invia");
function mostra(classe, testo) { esito.className = "esito " + classe; esito.textContent = testo; esito.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
modulo.addEventListener("submit", function (ev) {
  ev.preventDefault();
  var f = new FormData(modulo), d = T[lingua];
  var tipoStruttura = f.get("tipo_struttura") || "hotel";
  var dati = {
    tipo: "hotel", ente: (f.get("ente") || "").trim(), localita: (f.get("localita") || "").trim(), paese: f.get("paese"), sito: f.get("sito"),
    camere: f.get("camere"), referente: f.get("referente"), ruolo: (f.get("ruolo") || "") + " · " + tipoStruttura, email: (f.get("email") || "").trim(), telefono: f.get("telefono"),
    servizi: f.getAll("servizi"), luoghi: f.get("luoghi"), note: f.get("note"),
    ricontatto: f.get("ricontatto"), lingua: lingua, consenso: document.getElementById("consenso").checked, sito_azienda: f.get("sito_azienda"), campagna: CAMPAGNA
  };
  if (!dati.ente || !dati.localita || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(dati.email) || !dati.consenso) { mostra("no", d.manca); return; }
  tasto.disabled = true;
  fetch("/api/enti/richiesta", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dati) })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (x) {
      if (x.ok && x.j && x.j.ok) { mostra("ok", x.j.conferma_inviata === false ? d.ok_senza : d.ok); modulo.reset(); document.getElementById("lingua").value = lingua; }
      else mostra("no", x.j && x.j.error === "dati_mancanti" ? d.manca : d.errore);
    })
    .catch(function () { mostra("no", d.errore); })
    .then(function () { tasto.disabled = false; });
});
