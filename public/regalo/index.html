<title>WIP — Un regalo per te</title>
<meta name="description" content="Un regalo per il tuo viaggio: crediti per WIP, l'audioguida che parte da sola.">

<!--
  La presentazione del coupon regalo (12/10/2026, committente: «oltre al codice coupon si deve generare un QR code
  che apra una pagina… una cosa bella tipo un pdf, mezza pagina di presentazione e mezza con il QR, il nome
  dell'hotel/ente con una dedica… può essere stampata e/o data al cliente via digitale, deve funzionare anche senza
  inquadrare il QR, e accrediti i crediti regalo»; «solo il nome e la località»).
  UN FOGLIO A4: sopra la presentazione, sotto il QR che apre QUESTA pagina. Sullo schermo c'è in più il tasto
  «Attiva il regalo»: se nel browser c'è già una sessione di wip.guide accredita subito (POST /api/coupon/redeem),
  altrimenti manda all'app web con ?coupon=…&regalo=1, che dopo l'accesso riscatta da sola (ProfileScreen).
  Il riscatto non è mai automatico all'apertura: chi stampa il foglio non deve consumare un utilizzo.
  Misure in mm e foglio di 296 mm (mai esattamente una pagina: uscirebbe una seconda pagina vuota).
-->
<style>

  .barra { max-width:210mm; margin:0 auto; padding:12px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  .barra select, .barra button { border:1px solid var(--bordo); background:#fff; color:var(--testo); border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700; cursor:pointer; }
  .azioni { display:flex; flex-wrap:wrap; gap:8px; }
  .foglio { width:210mm; max-width:100%; min-height:296mm; margin:0 auto 24px; background:#fff; box-shadow:0 6px 30px rgba(0,0,0,.15); display:flex; flex-direction:column; overflow:hidden; }
  .sopra { flex:0 0 auto; min-height:148mm; background:linear-gradient(160deg,#1e3a8a 0%,#16306f 60%,#0f2557 100%); color:#fff; padding:13mm 15mm 11mm; display:flex; flex-direction:column; }
  .marchio { font-weight:900; letter-spacing:.04em; font-size:13pt; display:flex; justify-content:space-between; align-items:baseline; }
  .marchio span { font-weight:600; font-size:10pt; opacity:.8; }
  .dedica { margin-top:9mm; }
  .da { font-size:10pt; text-transform:uppercase; letter-spacing:.16em; color:#f0d9ae; font-weight:700; }
  h1 { font-size:27pt; line-height:1.1; margin:2mm 0 1mm; font-weight:900; overflow-wrap:anywhere; }
  h1.lungo { font-size:20pt; }
  .localita { font-size:12pt; opacity:.85; }
  .frase { font-size:16pt; line-height:1.4; margin:8mm 0 0; }
  .frase b { color:#f0d9ae; }
  .punti { margin:auto 0 0; padding:7mm 0 0; list-style:none; display:grid; grid-template-columns:repeat(3,1fr); gap:5mm; }
  .punti li { background:rgba(255,255,255,.1); border-radius:4mm; padding:4mm; font-size:10pt; line-height:1.35; }
  .punti b { display:block; font-size:11pt; margin-bottom:1mm; color:#f0d9ae; }
  .sotto { flex:1 1 50%; padding:11mm 15mm 9mm; display:flex; flex-direction:column; }
  .riga { display:flex; gap:11mm; align-items:center; }
  .qr { flex:0 0 58mm; width:58mm; padding:3mm; border:1.2mm solid var(--blu); border-radius:5mm; background:#fff; }
  .qr svg, .qrapp svg { display:block; width:100%; height:auto; }
  .come { flex:1; min-width:0; }
  .come h2 { font-size:17pt; margin:0 0 3mm; color:var(--blu); line-height:1.15; }
  .come ol { margin:0; padding-left:5.5mm; font-size:11pt; }
  .come li { margin-bottom:1.6mm; }
  .codice { margin-top:8mm; border:.7mm dashed var(--blu); border-radius:4mm; padding:4mm 5mm; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:3mm; }
  .codice small { font-size:9.5pt; color:var(--grigio); display:block; }
  .codice strong { font-size:21pt; letter-spacing:.12em; color:var(--blu); font-weight:900; word-break:break-all; }
  .codice .dove { font-size:10.5pt; text-align:right; }
  .codice .dove b { color:var(--blu); }
  .piede { margin-top:auto; padding-top:6mm; display:flex; align-items:center; gap:5mm; font-size:9.5pt; color:var(--grigio); }
  .qrapp { flex:0 0 19mm; width:19mm; text-align:center; }
  .qrapp small { display:block; font-size:6.5pt; font-weight:700; line-height:1.1; margin-top:.6mm; }
  .piede b { color:var(--testo); }
  .piede .sito { margin-left:auto; font-weight:900; color:var(--blu); font-size:12pt; white-space:nowrap; }
  .attiva { margin-top:6mm; }
  .tasto { display:block; width:100%; border:0; background:var(--oro); color:#fff; border-radius:999px; padding:15px 24px; font-weight:900; font-size:17px; cursor:pointer; }
  .tasto[disabled] { opacity:.6; cursor:default; }
  .esito { margin-top:10px; border-radius:12px; padding:12px 16px; font-size:15px; font-weight:700; display:none; }
  .esito.ok { display:block; background:#ecfdf5; color:#047857; }
  .esito.no { display:block; background:#fef2f2; color:#b91c1c; }

  .dopo p { margin:0 0 10px; font-size:15px; font-weight:600; }
  .tasto.scarica { background:var(--blu); text-align:center; text-decoration:none; }
  .avviso { max-width:210mm; margin:0 auto 12px; padding:0 14px; }
  .avviso div { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:12px; padding:12px 16px; font-size:15px; font-weight:600; }
  .senza { max-width:520px; margin:40px auto; background:#fff; border-radius:18px; padding:24px; text-align:center; }
  .senza input { width:100%; border:2px solid var(--bordo); border-radius:12px; padding:14px; font-size:20px; text-align:center; letter-spacing:.1em; text-transform:uppercase; margin:14px 0; }

    .foglio { min-height:0; }

  @media print {

</div>

var LINGUE = ["IT","EN","FR","ES","DE","RU","ZH"];
var LOCALE = { IT:"it-IT", EN:"en-GB", FR:"fr-FR", ES:"es-ES", DE:"de-DE", RU:"ru-RU", ZH:"zh-CN" };
var APP_STORE = "https://apps.apple.com/app/apple-store/id6806769883?pt=129382959&ct=regalo&mt=8";
// (13/11/2026) L'app è anche su Google Play: secondo codice nel piede, e su un telefono Android il tasto porta lì.
var GOOGLE_PLAY = "https://play.google.com/store/apps/details?id=com.itaintasca.app";
var E_ANDROID = /Android/i.test(navigator.userAgent || "");
var q = new URLSearchParams(location.search);
var codice = String(q.get("codice") || q.get("code") || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 30);
var dati = null, lingua = "IT", linguaScelta = false;
function $(id) { return document.getElementById(id); }
function linguaIniziale() {
  var l = (q.get("lang") || "").toUpperCase();
  if (LINGUE.indexOf(l) >= 0) { linguaScelta = true; return l; }
  var n = (navigator.language || "en").slice(0, 2).toUpperCase();
  return LINGUE.indexOf(n) >= 0 ? n : "EN";
}
function indirizzo() { return "https://www.wip.guide/regalo?codice=" + encodeURIComponent(codice) + (lingua === "IT" ? "" : "&lang=" + lingua); }
function disegnaQr(el, testo) {
  try { var qr = qrcode(0, "M"); qr.addData(testo); qr.make(); el.innerHTML = qr.createSvgTag(4, 0); } catch (e) { el.textContent = ""; }
}
function esito(tipo, testo) { var e = $("esito"); e.className = "esito " + tipo; e.textContent = testo; }
function applica(l) {
  lingua = l;
  var d = T[l];
  document.documentElement.lang = l.toLowerCase();
  document.querySelectorAll("[data-t]").forEach(function (el) { var k = el.getAttribute("data-t"); if (d[k] != null) el.textContent = d[k]; });
  $("lingua").value = l;
  if (accreditato) invitaAScaricare();
  if (!dati) return;
  var ente = dati.ente || "WIP";
  $("ente").textContent = ente;
  $("ente").className = ente.length > 34 ? "lungo" : "";
  $("localita").textContent = dati.localita || "";
  $("frase").innerHTML = d.frase.replace("{n}", String(dati.crediti));
  $("codice").textContent = dati.codice;
  $("scade").textContent = dati.scade ? d.scade.replace("{d}", new Date(dati.scade).toLocaleDateString(LOCALE[l], { timeZone: "UTC" })) : "";
  document.title = "WIP — " + ente;
  disegnaQr($("qr"), indirizzo());
  disegnaQr($("qrapp"), APP_STORE);
  disegnaQr($("qrplay"), GOOGLE_PLAY);
  var av = $("avviso");
  if (dati.stato !== "attivo") { $("avvisoTesto").textContent = d[dati.stato] || d.finito; av.hidden = false; $("attiva").disabled = true; }
  else av.hidden = true;
}
// La sessione dell'app web sta nel localStorage di questo stesso sito (supabase-js): se c'è ed è valida si
// riscatta da qui; se manca o è scaduta ci pensa l'app, che la rinnova o chiede l'accesso.
function gettone() {
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^sb-.+-auth-token$/.test(k)) {
        var s = JSON.parse(localStorage.getItem(k) || "null");
        if (s && s.access_token && (!s.expires_at || s.expires_at * 1000 > Date.now() + 30000)) return s.access_token;
      }
    }
  } catch (e) {}
  return null;
}
var accreditato = false;
function invitaAScaricare() {
  accreditato = true;
  $("dopoTesto").textContent = T2[lingua].dopo;
  $("scarica").textContent = T2[lingua].scarica;
  $("scarica").href = E_ANDROID ? GOOGLE_PLAY : APP_STORE;
  $("dopo").hidden = false;
}
function versoLApp() { location.href = "/?coupon=" + encodeURIComponent(codice) + "&regalo=1#profilo"; }
function attiva() {
  var d = T[lingua], t = gettone();
  if (!t) return versoLApp();
  var b = $("attiva"); b.disabled = true; esito("ok", d.attendi);
  fetch("/api/coupon/redeem", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + t }, body: JSON.stringify({ code: codice, lingua: lingua }) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { stato: r.status, j: j }; }); })
    .then(function (x) {
      if (x.stato === 401) return versoLApp();
      if (x.stato === 200 && x.j.success) { esito("ok", d.fatto.replace("{n}", String(x.j.credits))); return invitaAScaricare(); }
      b.disabled = false;
      if (x.stato === 403 && x.j.motivo === "email_da_confermare") return esito("no", T2[lingua].conferma);
      if (x.stato === 403 && x.j.motivo === "email_temporanea") return esito("no", T2[lingua].temporanea);
      if (x.stato === 409 && /gi[aà]/i.test(String(x.j.error || ""))) { b.disabled = true; esito("ok", d.gia); return invitaAScaricare(); }
      if (x.stato === 410) { b.disabled = true; return esito("no", d.finito); }
      esito("no", d.errore);
    })
    .catch(function () { b.disabled = false; esito("no", d.errore); });
}
function senzaCodice(messaggio) {
  $("foglio").hidden = true; $("azioni").hidden = true; $("senza").hidden = false;
  if (messaggio) { $("avvisoTesto").textContent = messaggio; $("avviso").hidden = false; }
}
applica(linguaIniziale());
if (!codice) senzaCodice("");
else fetch("/api/coupon/presentazione?codice=" + encodeURIComponent(codice))
  .then(function (r) { if (r.status === 404 || r.status === 400) throw new Error("inesistente"); if (!r.ok) throw new Error("errore"); return r.json(); })
  .then(function (j) {
    dati = j;
    // Senza una lingua nel link e con un browser in una lingua che non abbiamo, vale quella dell'ente.
    if (!linguaScelta && LINGUE.indexOf((navigator.language || "").slice(0, 2).toUpperCase()) < 0 && LINGUE.indexOf(String(j.lingua || "").toUpperCase()) >= 0) lingua = String(j.lingua).toUpperCase();
    $("foglio").hidden = false; $("azioni").hidden = false;
    if (navigator.share) $("condividi").hidden = false;
    applica(lingua);
    // Ritorno dall'app web, che ha riscattato dopo l'accesso (?fatto=<crediti>): conferma e invito a scaricare.
    var fatto = parseInt(q.get("fatto") || "", 10);
    if (fatto > 0) { $("attiva").disabled = true; esito("ok", T[lingua].fatto.replace("{n}", String(fatto))); invitaAScaricare(); }
  })
  .catch(function (e) { senzaCodice(T[lingua][e.message === "inesistente" ? "inesistente" : "errore"]); });
$("lingua").addEventListener("change", function (e) { $("avviso").hidden = true; applica(e.target.value); });
$("attiva").addEventListener("click", attiva);
$("stampa").addEventListener("click", function () {
  // Il nome del PDF viene dal titolo della pagina.
  var prima = document.title; document.title = "WIP - regalo " + (dati && dati.ente ? dati.ente : codice);
  window.print(); setTimeout(function () { document.title = prima; }, 1500);
});
$("copia").addEventListener("click", function () {
  var b = this, d = T[lingua];
  (navigator.clipboard ? navigator.clipboard.writeText(indirizzo()) : Promise.reject()).then(function () { b.textContent = d.copiato; setTimeout(function () { b.textContent = d.copia; }, 1800); }).catch(function () { prompt("", indirizzo()); });
});
$("condividi").addEventListener("click", function () {
  var d = T[lingua];
  navigator.share({ title: "WIP", text: d.testoInvio.replace("{ente}", dati.ente || "WIP").replace("{n}", String(dati.crediti)), url: indirizzo() }).catch(function () {});
});
$("formCodice").addEventListener("submit", function (e) {
  e.preventDefault();
  var c = $("campoCodice").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (c) location.href = "/regalo?codice=" + encodeURIComponent(c) + (lingua === "IT" ? "" : "&lang=" + lingua);
});
