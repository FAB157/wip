<!--
  Pagina per enti e territori (11/10/2026, committente: «una pagina per la registrazione gratis e le
  corrispondenze, con già i dettagli e se vogliono essere ricontattati — in tutte le lingue»).
  Il modulo va a POST /api/enti/richiesta (server.ts), che salva in `richieste_enti` e manda la conferma.
  Cosa si promette, e solo questo: luoghi inseriti e messi in evidenza (quali sono «gemme» lo decidiamo noi),
  audioguida gratuita di chiese e musei e guida del museo, per cominciare fino a 3 luoghi per ente, solo da
  fonti verificabili (il materiale lo mandano loro). Nessun tempo promesso, nessun numero di visitatori.
  Le 7 lingue stanno nel dizionario T qui sotto: una voce nuova va aggiunta in tutte e sette.
-->
<style>
  :root { --blu:#1e3a8a; --chiaro:#f8f5f0; --testo:#1f2937; --grigio:#6b7280; --bordo:#e5e7eb; --verde:#166534; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--testo); background:var(--chiaro); line-height:1.55; }
  header { background:var(--blu); color:#fff; padding:28px 20px 34px; }
  .dentro { max-width:760px; margin:0 auto; }
  .riga-alta { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:22px; }
  .marchio { color:#fff; text-decoration:none; font-weight:800; letter-spacing:.02em; }
  select#lingua { background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:6px 12px; font-size:14px; }
  select#lingua option { color:#111; }
  h1 { font-size:clamp(26px,5vw,38px); line-height:1.15; margin:0 0 12px; }
  header p { margin:0; font-size:17px; opacity:.92; max-width:620px; }
  main { padding:26px 20px 60px; }
  h2 { color:var(--blu); font-size:21px; margin:30px 0 12px; }
  .punti { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); padding:0; margin:0; list-style:none; }
  .punti li { background:#fff; border:1px solid var(--bordo); border-radius:16px; padding:16px; }
  .punti b { display:block; color:var(--blu); margin-bottom:4px; }
  .nota { background:#fff; border-left:4px solid var(--verde); border-radius:10px; padding:12px 16px; margin:14px 0 0; font-size:15px; }
  form { background:#fff; border:1px solid var(--bordo); border-radius:20px; padding:20px; margin-top:8px; }
  .campo { margin-bottom:14px; }
  .due { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  label { display:block; font-size:13px; font-weight:700; color:var(--blu); margin-bottom:5px; }
  input[type=text],input[type=email],input[type=tel],input[type=url],select,textarea { width:100%; border:1px solid #cbd5e1; border-radius:10px; padding:10px 12px; font:inherit; background:#fff; color:inherit; }
  textarea { min-height:96px; resize:vertical; }
  .scelte label { display:flex; gap:8px; align-items:flex-start; font-weight:500; color:var(--testo); font-size:15px; margin-bottom:8px; }
  .scelte input { margin-top:4px; }
  .aiuto { font-size:13px; color:var(--grigio); margin-top:4px; }
  button { background:var(--blu); color:#fff; border:0; border-radius:999px; padding:13px 26px; font:inherit; font-weight:700; cursor:pointer; }
  button[disabled] { opacity:.6; cursor:default; }
  .esito { margin-top:14px; padding:12px 16px; border-radius:12px; display:none; }
  .esito.ok { display:block; background:#dcfce7; color:#14532d; }
  .esito.no { display:block; background:#fee2e2; color:#7f1d1d; }
  .esca { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  footer { text-align:center; color:var(--grigio); font-size:13px; padding:0 20px 40px; }
  footer a { color:var(--blu); }
</style>

      </div>

      </div>

      </div>
      <div class="campo scelte"><label style="font-weight:700;color:var(--blu);font-size:13px" data-t="f_servizi"></label>

        <label><input type="checkbox" name="servizi" value="audioguida"><span data-t="s_audioguida"></span></label>
        <label><input type="checkbox" name="servizi" value="guida_museo"><span data-t="s_museo"></span></label>
      </div>

      <div class="campo scelte"><label style="font-weight:700;color:var(--blu);font-size:13px" data-t="f_ricontatto"></label>
        <label><input type="radio" name="ricontatto" value="email" checked><span data-t="r_email"></span></label>
        <label><input type="radio" name="ricontatto" value="telefono"><span data-t="r_telefono"></span></label>
        <label><input type="radio" name="ricontatto" value="no"><span data-t="r_no"></span></label>
      </div>
      <div class="campo"><label for="note" data-t="f_note"></label><textarea id="note" name="note" maxlength="2000" style="min-height:70px"></textarea></div>
      <div class="esca" aria-hidden="true"><label for="sito_azienda">Company website</label><input type="text" id="sito_azienda" name="sito_azienda" tabindex="-1" autocomplete="off"></div>
      <div class="campo scelte"><label><input type="checkbox" id="consenso" name="consenso"><span><span data-t="consenso"></span> <a href="/privacy" target="_blank" rel="noopener" data-t="privacy"></a></span></label></div>

      <div class="esito" id="esito" role="status"></div>
    </form>
  </div>
</main>

var LINGUE = ["IT","EN","FR","ES","DE","RU","ZH"];
function linguaIniziale() {
  var q = (new URLSearchParams(location.search).get("lang") || "").toUpperCase();
  if (LINGUE.indexOf(q) >= 0) return q;
  try { var s = localStorage.getItem("wip_comuni_lang"); if (s && LINGUE.indexOf(s) >= 0) return s; } catch (e) {}
  var n = (navigator.language || "en").slice(0, 2).toUpperCase();
  return LINGUE.indexOf(n) >= 0 ? n : "EN";
}
var lingua = linguaIniziale();
// Da quale campagna arriva chi apre la pagina (?c=enti-it nel link dell'email): si conta la visita, senza cookie.
var CAMPAGNA = (new URLSearchParams(location.search).get("c") || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 40);
(function () { try {
  var s = sessionStorage.getItem("wip_sessione"); var nuova = !sessionStorage.getItem("wip_vista_comuni");
  if (!s) { s = Math.random().toString(36).slice(2, 14); sessionStorage.setItem("wip_sessione", s); }
  if (nuova) { sessionStorage.setItem("wip_vista_comuni", "1"); fetch("/api/enti/visita", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pagina: "comuni", c: CAMPAGNA, lingua: lingua, sessione: s }), keepalive: true }); }
} catch (e) {} })();
function applica(l) {
  lingua = l; var d = T[l];
  document.documentElement.lang = l.toLowerCase();
  document.querySelectorAll("[data-t]").forEach(function (el) { var k = el.getAttribute("data-t"); if (d[k] != null) el.textContent = d[k]; });
  document.title = "WIP — " + d.titolo;
  document.getElementById("lingua").value = l;
  try { localStorage.setItem("wip_comuni_lang", l); } catch (e) {}
}
applica(lingua);
document.getElementById("lingua").addEventListener("change", function (e) { applica(e.target.value); });

var modulo = document.getElementById("modulo"), esito = document.getElementById("esito"), tasto = document.getElementById("invia");
function mostra(classe, testo) { esito.className = "esito " + classe; esito.textContent = testo; esito.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
modulo.addEventListener("submit", function (ev) {
  ev.preventDefault();
  var f = new FormData(modulo), d = T[lingua];
  var dati = {
    tipo: f.get("tipo"), ente: (f.get("ente") || "").trim(), localita: (f.get("localita") || "").trim(), paese: f.get("paese"), sito: f.get("sito"),
    referente: f.get("referente"), ruolo: f.get("ruolo"), email: (f.get("email") || "").trim(), telefono: f.get("telefono"),
    servizi: f.getAll("servizi"), luoghi: f.get("luoghi"), materiale: f.get("materiale"), note: f.get("note"),
    ricontatto: f.get("ricontatto"), lingua: lingua, consenso: document.getElementById("consenso").checked, sito_azienda: f.get("sito_azienda"), campagna: CAMPAGNA
  };
  if (!dati.ente || !dati.localita || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(dati.email) || !dati.consenso) { mostra("no", d.manca); return; }
  tasto.disabled = true;
  fetch("/api/enti/richiesta", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dati) })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (x) {
      if (x.ok && x.j && x.j.ok) { mostra("ok", x.j.conferma_inviata === false ? d.ok_senza : d.ok); modulo.reset(); document.getElementById("lingua").value = lingua; }
      else mostra("no", x.j && x.j.error === "dati_mancanti" ? d.manca : d.errore);
    })
    .catch(function () { mostra("no", d.errore); })
    .then(function () { tasto.disabled = false; });
});
