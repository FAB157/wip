apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

// Credenziali di firma: il file esiste solo sulla macchina che firma le
// release (è gitignorato). Dichiarato qui, fuori dal blocco android, così è
// visibile sia a signingConfigs sia a buildTypes.
def keystorePropertiesFile = rootProject.file('keystore.properties')

android {
    namespace "com.itaintasca.app"
    compileSdk libs.versions.compileSdk.get().toInteger()
    defaultConfig {
        applicationId "com.itaintasca.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // multiDex NON si tocca: AndroidManifest.xml dichiara
        // android:name="androidx.multidex.MultiDexApplication" come classe
        // Application. Toglierlo (o togliere la dipendenza multidex) fa
        // crashare l'app all'avvio con ClassNotFoundException.
        multiDexEnabled true
        // NB: nessun resConfigs/localeFilters qui. Le lingue dell'app sono 7
        // (src/lib/i18n.ts: IT EN FR ES DE RU ZH) ma i testi arrivano dal
        // bundle JS, non dalle risorse Android: filtrare i locali farebbe
        // risparmiare solo le traduzioni delle librerie, e su AGP 9
        // `resConfigs` e' sostituito da androidResources.localeFilters.
        // Non si tocca senza una build di prova.
        versionCode 6
        versionName "1.3.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        buildConfigField "String", "SUPABASE_URL", "\"https://qfxxhzkkrkvbuekfknhh.supabase.co\""
        // Chiave PUBBLICA (29/08/2026): la vecchia `anon` era un JWT legacy.
        // Supabase le sta ritirando e vanno disattivate, perche' la
        // service_role della stessa generazione era finita nel repository
        // pubblico. Questa e' la nuova publishable key: stesso ruolo (accesso
        // pubblico protetto dalle RLS), ma revocabile da sola e senza
        // scadenza cablata nel token.
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"sb_publishable_uTKPsWB6z1M3nSeYOLk3mw_soqmIFOP\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    // Credenziali di firma lette da keystore.properties (gitignorato), MAI
    // dal build.gradle versionato. Il blocco si attiva solo se il file esiste.
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                def ksProps = new Properties()
                ksProps.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Senza questa assegnazione signingConfigs.release veniva DEFINITO
            // ma mai USATO: l'APK/AAB di release usciva firmato con la chiave di
            // debug (o non firmato), quindi rifiutato dal Play Store e non
            // aggiornabile sopra un'installazione esistente.
            // Se keystore.properties non c'è (CI, altra macchina) si ricade
            // sulla firma di debug: la build passa, ma l'artefatto NON è
            // pubblicabile — da qui l'avviso in console.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                logger.warn("ATTENZIONE: android/keystore.properties assente: la build di release sara' firmata con la chiave di DEBUG e non e' pubblicabile sul Play Store.")
            }
        }
        debug {
            crunchPngs false
        }
    }
    kapt {
        correctErrorTypes = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.appcompat
    implementation libs.androidx.coordinatorlayout
    implementation libs.androidx.core.splashscreen
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation project(':capacitor-android')
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation project(':capacitor-cordova-android-plugins')

    // Jetpack Media3 (ExoPlayer & MediaSession) for background audio playback
    implementation "androidx.media3:media3-exoplayer:1.2.0"
    implementation "androidx.media3:media3-session:1.2.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:${rootProject.ext.kotlinxCoroutinesVersion}"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation libs.google.gson

    // Play Services Location for native geofencing and background tracking
    // Using version 21.3.0 as requested
    // (Old version was 21.0.1)

    // Room Database
    implementation libs.room.runtime
    implementation libs.room.ktx
    kapt libs.room.compiler

    // Android Auto (Car App Library, template host) + lifecycleScope per la Screen
    implementation "androidx.car.app:app:1.4.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

    // EncryptedSharedPreferences: cifra userId/accessToken (identità utente,
    // ItaintaBackgroundPoiPlugin.setUserContext) invece di salvarli in chiaro.
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
