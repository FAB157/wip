[versions]
activity = "1.13.0"
annotation = "1.10.0"
appcompat = "1.7.1"
coordinatorlayout = "1.3.0"
core = "1.19.0"
core-splashscreen = "1.2.0"
espresso-core = "3.7.0"
fragment = "1.8.9"
google-services = "4.4.4"
gradle = "9.2.1"
gradle-toolchains-foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
junit-version = "1.3.0"
webkit = "1.16.0"
kotlin = "2.4.0"
gson = "2.11.0"
coroutines = "1.11.0"
room = "2.8.4"
compileSdk = "37"
minSdk = "24"
# Allineato a variables.gradle (rootProject.ext.targetSdkVersion), l'unico
# valore effettivamente usato da app/build.gradle. Google Play rifiuta gli
# update sotto API 36 dal 31/08/2026.
targetSdk = "36"

[libraries]
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version.ref = "coordinatorlayout" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit-version" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
google-services = { group = "com.google.gms", name = "google-services", version.ref = "google-services" }
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "gradle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

[plugins]
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "gradle-toolchains-foojay-resolver-convention" }
