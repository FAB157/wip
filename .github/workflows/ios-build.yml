name: Build iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        # VITE_REVENUECAT_IOS_KEY: senza questa chiave (appl_...) main.tsx NON
        # inizializza RevenueCat su iOS e lo shop mostra "nessun pacchetto" —
        # acquisti in-app morti nell'IPA. Il secret va creato in
        # Settings → Secrets and variables → Actions del repo GitHub.
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Archive App (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qry WIP-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WIP-iOS-unsigned
          path: build/WIP-unsigned.ipa
          retention-days: 30
