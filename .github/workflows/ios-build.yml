name: Build iOS

on:
  push:
    # (29/08/2026) Anche il ramo di lavoro: la build iOS esiste SOLO qui
    # (niente Mac), e le modifiche al progetto Xcode fatte a mano vanno
    # provate PRIMA di finire su main.
    branches: [ main, master, onboarding-e-garanzia-pioggia ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # Un IPA senza la chiave RevenueCat compila benissimo e arriva in review
      # con lo shop SPENTO: offerte vuote, pulsanti d'acquisto disabilitati,
      # "Ripristina acquisti" in errore. E' un rigetto Apple, e finora non se
      # ne accorgeva nessuno fino al test sul telefono. Qui almeno lo si vede
      # nel log, in cima al riepilogo della build.
      - name: Controlla i secret degli acquisti
        env:
          RC: ${{ secrets.REVENUECAT_IOS_KEY }}
          CARTO: ${{ secrets.CARTO_API_KEY }}
        run: |
          if [ -z "$RC" ]; then
            echo "::warning title=RevenueCat iOS assente::Il secret REVENUECAT_IOS_KEY non e' impostato: l'IPA avra' gli acquisti in-app NON funzionanti (shop vuoto, ripristino in errore). Apple rifiuta. Crearlo in Settings > Secrets and variables > Actions."
          else
            echo "RevenueCat iOS: chiave presente."
          fi
          if [ -z "$CARTO" ]; then
            echo "::warning title=CARTO assente::Il secret CARTO_API_KEY non e' impostato: le tile della mappa usciranno con il watermark 'API KEY REQUIRED' (l'app ripiega su /api/config/public, ma solo se la rete risponde)."
          else
            echo "CARTO: chiave presente."
          fi

      - name: Build Web App
        # VITE_REVENUECAT_IOS_KEY: senza questa chiave (appl_...) main.tsx NON
        # inizializza RevenueCat su iOS e lo shop mostra "nessun pacchetto" —
        # acquisti in-app morti nell'IPA. Il secret va creato in
        # Settings → Secrets and variables → Actions del repo GitHub.
        # VITE_CARTO_API_KEY: CARTO non serve più tile anonime (26/08/2026).
        # Senza la chiave in fase di build (Vite la inlinea) ogni tile della
        # mappa esce con il watermark "API KEY REQUIRED" — visto sull'IPA del
        # 28/08/2026. Secret da creare come CARTO_API_KEY (chiave gratuita da
        # carto.com/basemaps/apikey, è una chiave pubblica di client).
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
          VITE_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup CocoaPods
        run: |
          cd ios/App
          pod install

      # ─────────────────────────────────────────────────────────────────────
      # FIRMA (30/08/2026). Senza i segreti Apple il job si comporta ESATTAMENTE
      # come prima: archivio non firmato + artefatto, che serve a sapere se il
      # codice compila. Con i segreti, invece, firma davvero e carica su
      # TestFlight — nessun Mac, nessun certificato da esportare a mano.
      #
      # Si usa la chiave API di App Store Connect (`-allowProvisioningUpdates`):
      # e' Xcode stesso, sul runner, a creare/scaricare certificato di
      # distribuzione e profili per i DUE bundle id (app + estensione Live
      # Activity). La via classica — certificato .p12 + profili esportati da un
      # Mac e messi nei segreti — qui non e' praticabile: un Mac non c'e'.
      # ─────────────────────────────────────────────────────────────────────
      - name: Chiave API App Store Connect
        id: asc
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning title=Firma iOS non configurata::Mancano i secret Apple (ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID): build NON firmata, nessun caricamento su TestFlight."
            echo "firma=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # xcodebuild cerca le chiavi qui per nome: AuthKey_<KEYID>.p8.
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "firma=si" >> "$GITHUB_OUTPUT"

      - name: Archive App (unsigned)
        if: steps.asc.outputs.firma != 'si'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath build/App.xcarchive \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Package unsigned IPA
        if: steps.asc.outputs.firma != 'si'
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -qry WIP-unsigned.ipa Payload

      - name: Upload IPA artifact
        if: steps.asc.outputs.firma != 'si'
        uses: actions/upload-artifact@v4
        with:
          name: WIP-iOS-unsigned
          path: build/WIP-unsigned.ipa
          retention-days: 30

      # ── Da qui in giu': solo con i segreti Apple presenti ──────────────────

      - name: Numero di build progressivo
        if: steps.asc.outputs.firma == 'si'
        run: |
          # App Store Connect rifiuta due caricamenti con lo stesso
          # CFBundleVersion. Il numero del run e' unico e cresce sempre, e va
          # scritto su ENTRAMBI i target (app ed estensione: Apple pretende
          # che combacino). La versione utente (MARKETING_VERSION) resta
          # quella del progetto — 1.3, come Android.
          cd ios/App
          agvtool new-version -all ${{ github.run_number }}

      # (30/08/2026) FIRMA MANUALE VIA FASTLANE — le tre build fallite prima di
      # arrivarci sono annotate per esteso in ios/App/fastlane/Fastfile.
      # In breve: le impostazioni di firma passate a `xcodebuild` valgono per
      # TUTTI i target insieme, ma qui i target sono due (l'app e l'estensione
      # della Live Activity) e ognuno vuole il SUO profilo. La lane scrive la
      # firma nel progetto target per target, archivia, esporta e carica.
      # Il certificato di distribuzione e' UNO e non si crea qui: vedi la nota
      # in Fastfile. Arriva come .p12 in un secret, si scrive su file e basta.
      - name: Certificato di distribuzione dal secret
        if: steps.asc.outputs.firma == 'si'
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
        run: |
          if [ -z "$APPLE_DIST_CERT_P12" ]; then
            echo "::error title=Certificato assente::Manca il secret APPLE_DIST_CERT_P12 (il .p12 del certificato di distribuzione, in base64). Senza, la firma non parte."
            exit 1
          fi
          if ! printf '%s' "$APPLE_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12" 2>/dev/null; then
            echo "::error title=Base64 non valido::Il secret APPLE_DIST_CERT_P12 non e' base64 leggibile. Di solito succede quando il valore nuovo viene incollato IN CODA al vecchio invece che al suo posto: svuota il campo prima di incollare."
            exit 1
          fi
          # (30/08/2026) IL CONTROLLO CHE MANCAVA. Per quattro build l'errore
          # e' arrivato in ritardo e travestito: `security` di macOS importava
          # il .p12 in silenzio senza importarlo, e fastlane si lamentava DUE
          # passi dopo di non trovare «a matching code signing identity for
          # type AppStore», mandando a cercare fra i profili. Qui il file si
          # apre subito: se non si apre, si sa perche' e si sa dove.
          if ! openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -nokeys -passin pass: -info >/dev/null 2>&1; then
            echo "::error title=Certificato illeggibile::Il .p12 non si apre. Va esportato SENZA password e con la cifratura vecchia, l'unica che macOS legge: openssl pkcs12 -export -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 -passout pass:"
            exit 1
          fi
          echo "Certificato decodificato e leggibile ($(wc -c < "$RUNNER_TEMP/dist.p12") byte)."

      - name: Firma, archivia e carica su TestFlight
        if: steps.asc.outputs.firma == 'si'
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DIST_CERT_PATH: ${{ runner.temp }}/dist.p12
          # Senza, fastlane si ferma su domande che nessuno leggera'.
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: fastlane beta

      - name: Upload IPA artifact (firmato)
        if: steps.asc.outputs.firma == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: WIP-iOS-signed
          path: build/WIP.ipa
          retention-days: 30
